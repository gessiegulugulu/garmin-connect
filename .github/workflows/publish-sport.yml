name: Publish sport page

on:
  schedule:
    # Check daily at 08:30 Shanghai time; cadence below runs every three days.
    - cron: "30 0 * * *"
  push:
    branches: [main]
    paths:
      - TRAINING_PLAN.md
      - MONTHLY_ROUTINE.md
      - data/garmin-week.json
      - scripts/**
      - tests/**
      - .github/workflows/publish-sport.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sport-page
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check three-day cadence
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          due = (today - date(2026, 10, 23)).days % 3 == 0
          publish = os.environ["EVENT_NAME"] != "schedule" or due
          print(f"publish={str(publish).lower()}")
          PY

  publish:
    needs: cadence
    if: needs.cadence.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out training repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dashboard
        run: python3 -m unittest discover -s tests -v

      - name: Select encrypted Garmin session cache
        id: auth
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          sys.path.insert(0, "scripts")
          from garmin_token_cache import cache_prefix
          seed = os.environ.get("GARMIN_TOKENS_JSON", "")
          print(f"enabled={str(bool(seed)).lower()}")
          if seed:
              print(f"prefix={cache_prefix(seed)}-")
          PY

      - name: Restore encrypted Garmin session
        if: steps.auth.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/garmin-session/session.gpg
          key: ${{ steps.auth.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.auth.outputs.prefix }}

      - name: Sync the last seven complete days from Garmin
        id: sync
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_IS_CN: ${{ vars.GARMIN_IS_CN }}
        run: |
          if [ -n "$GARMIN_TOKENS_JSON" ]; then
            python3 -m pip install --disable-pip-version-check -r scripts/requirements-dashboard.txt
            python3 scripts/sync_garmin_data.py --encrypted-token-cache "$RUNNER_TEMP/garmin-session/session.gpg"
          else
            echo "::warning::GARMIN_TOKENS_JSON is not configured. Only in-window cached measurements can be displayed; see readme.md."
          fi

      - name: Preserve encrypted session even if data fetching failed
        if: always() && steps.auth.outputs.enabled == 'true' && steps.sync.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/garmin-session/session.gpg
          key: ${{ steps.auth.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check out personal website
        uses: actions/checkout@v4
        with:
          repository: gessiegulugulu/gessiegulugulu.github.io
          ref: main
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Build sport page
        run: python3 scripts/build_sport_page.py --output website/content/sport.md

      - name: Commit and push when content changed
        working-directory: website
        run: |
          if [ -z "$(git status --porcelain -- content/sport.md)" ]; then
            echo "Sport page is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/sport.md
          git commit -m "chore: update sport page"
          git push origin HEAD:main
